name: Quran-Daten aktualisieren

# Holt Verse und Übersetzungen von Quran.com (scripts/fetch-quran.mjs),
# speichert das Ergebnis im Repo und startet danach das Deployment.
# Läuft automatisch, wenn die Versliste im Skript geändert wird, oder per Hand.
on:
  push:
    branches: [main]
    paths: [scripts/fetch-quran.mjs]
  workflow_dispatch:

permissions:
  contents: write   # um die erzeugten Dateien zu committen
  actions: write    # um danach das Deployment zu starten

concurrency:
  group: seed-quran
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run seed:quran
      - name: Änderungen committen (nur wenn es welche gibt)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quran-seed.json supabase/seed/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Quran-Daten aktualisiert (scripts/fetch-quran.mjs)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes mit GITHUB_TOKEN starten keine anderen Workflows, daher Deployment direkt anstoßen.
      # Quelle: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
      - name: Deployment starten
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
